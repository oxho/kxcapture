# Test installers for the KXCapture rebrand. These jobs use free GitHub-hosted
# runners and the repository's static Qt 6.12.0 release path.
#
# macOS does not call scripts/package-snow-shot.sh. That entry point stops unless
# scripts/snow-shot-macos-signing.py identity can see the private key for
# snow_shot/packaging/macos/release-signing.pem, and unless
# scripts/snow-shot-sparkle.py check-key can see the Ed25519 key for the public
# key in snow_shot/packaging/macos/sparkle.json. This workflow does not create,
# import, or commit either private key. The application is still built from the
# static release preset; CPack's publisher audit is left off, and a certificate
# generated inside the job signs the bundles.
#
# Windows follows scripts/bootstrap.ps1, scripts/build-static-qt.ps1, and
# scripts/package-snow-shot.ps1. There is no Authenticode signature.
name: KXCapture test installers

on:
  push:
    branches:
      - cursor/package-kxcapture-af5e
  workflow_dispatch:

concurrency:
  group: kxcapture-test-installers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64:
    name: Windows x64 installer
    # A commit message containing [skip-main] retries macOS without a second Windows build.
    if: ${{ !contains(github.event.head_commit.message, '[skip-main]') }}
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      VCPKG_MAX_CONCURRENCY: "2"
      VCPKG_DISABLE_METRICS: "1"
    steps:
      - name: Enable long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          function Show-Free {
            $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
            Write-Output ("C: free_gb={0:N1} size_gb={1:N1}" -f ($disk.FreeSpace / 1GB), ($disk.Size / 1GB))
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Output "Latest MSVC installation: $vs"
          Show-Free
          $remove = @(
            'C:\Program Files (x86)\Android',
            'C:\Android',
            'C:\Program Files\Microsoft SQL Server',
            'C:\Program Files (x86)\Microsoft SQL Server',
            "$env:LOCALAPPDATA\Android"
          )
          if ($vs -match '\\2026\\|\\18\\') {
            $remove += 'C:\Program Files\Microsoft Visual Studio\2022'
            $remove += 'C:\Program Files (x86)\Microsoft Visual Studio\2022'
          }
          foreach ($path in $remove) {
            if (Test-Path -LiteralPath $path) {
              Write-Output "Removing $path"
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Show-Free

      - name: Install CMake 4.2.3, NSIS, and Rust 1.97.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmakeRoot = Join-Path $env:RUNNER_TEMP 'cmake'
          New-Item -ItemType Directory -Path $cmakeRoot -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'cmake.zip'
          Invoke-WebRequest -Uri 'https://github.com/Kitware/CMake/releases/download/v4.2.3/cmake-4.2.3-windows-x86_64.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $cmakeRoot
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $cmakeRoot 'cmake-4.2.3-windows-x86_64\bin')
          choco install nsis llvm -y --no-progress
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (Test-Path -LiteralPath $nsis) { Add-Content -Path $env:GITHUB_PATH -Value $nsis }
          $llvm = 'C:\Program Files\LLVM\bin'
          if (Test-Path -LiteralPath $llvm) { Add-Content -Path $env:GITHUB_PATH -Value $llvm }

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1

      - name: Tool versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --version
          rustc --version
          makensis /VERSION
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion

      - name: Restore static Qt and vcpkg
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ${{ github.workspace }}/.tools/qt/6.12.0
            ${{ github.workspace }}/.tools/vcpkg/installed/static
          key: kxcapture-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'scripts/qt-toolchain.json', 'scripts/static-qt-features.json', 'scripts/build-static-qt.ps1', 'scripts/static-qt-features.json', 'cmake/vcpkg-overlay-ports/**', 'cmake/vcpkg-overlay-triplets/**') }}

      - name: Bootstrap static Windows dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/bootstrap.ps1 -Preset snow-shot-msvc-release -VcpkgVariants Static -SkipQtValidation

      - name: Build static Qt 6.12.0
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path (Get-Location) '.tools/qt/6.12.0/msvc2026_64-static-system-codecs'
          ./scripts/build-static-qt.ps1 -Architecture x64 -InstallPrefix $prefix -Parallelism 2 `
            -SourceDirectory (Join-Path $env:RUNNER_TEMP 'qt-src') `
            -BuildDirectory (Join-Path $env:RUNNER_TEMP 'qt-build')
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'qt-src'), (Join-Path $env:RUNNER_TEMP 'qt-build') -Recurse -Force -ErrorAction SilentlyContinue
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          Write-Output ("C: free_gb={0:N1}" -f ($disk.FreeSpace / 1GB))

      - name: Package installer and portable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = Join-Path (Get-Location) '.tools\qt\6.12.0\msvc2026_64-static-system-codecs'
          $qt = Join-Path $prefix 'lib\cmake\Qt6'
          $env:SNOW_QT_STATIC_DIR = $qt
          $env:Qt6_DIR = $qt
          $env:QTDIR = $prefix
          $core = Join-Path $qt '..\Qt6Core'
          Write-Host "Qt6Config=$(Test-Path (Join-Path $qt 'Qt6Config.cmake')) prefix=$prefix"
          Get-ChildItem -LiteralPath $core -Filter 'Qt6CoreTargets*' -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "target-file $($_.Name)" }
          $releaseTargets = Join-Path $core 'Qt6CoreTargets-release.cmake'
          $plainTargets = Join-Path $core 'Qt6CoreTargets.cmake'
          # Ninja's single-config install can omit the -release export the
          # release preset requires. Point that name at the installed export.
          if ((Test-Path -LiteralPath $plainTargets) -and -not (Test-Path -LiteralPath $releaseTargets)) {
            Copy-Item -LiteralPath $plainTargets -Destination $releaseTargets
            Write-Host 'Added Qt6CoreTargets-release.cmake from Qt6CoreTargets.cmake'
          }
          ./scripts/package-snow-shot.ps1 -Architecture x64 -Parallelism 2

      - name: Record version resources and checksums
        if: success()
        shell: pwsh
        run: ./scripts/ci/windows-collect-artifacts.ps1

      - name: Upload Windows artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kxcapture-windows-x64
          retention-days: 14
          path: artifacts/windows/
          if-no-files-found: error
